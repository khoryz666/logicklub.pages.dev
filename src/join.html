<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Us</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/bar.css">
    <link rel="stylesheet" href="css/join.css">
</head>

<body>
    <nav class="navbar" id="navbar"></nav>

    <main>
        <section>
            <section>
                <h1>Member Registration</h1>
                <p id="join-description">New to LOGICKlub? Create your member account by filling in the information below.</p>

                <div class="auth-mode-switch" role="group" aria-label="Choose sign up or sign in">
                    <button id="show-sign-up" class="auth-mode-btn active" type="button">New Member / Sign Up</button>
                    <button id="show-sign-in" class="auth-mode-btn" type="button">Existing Member / Sign In</button>
                </div>

                <form id="join-form" novalidate>
                    <div id="sign-up-panel">
                        <fieldset>
                            <legend>Personal Information</legend>

                            <label for="full-name">Full Name:</label><br>
                            <input id="full-name" type="text" placeholder="Full Name" required><br><br>

                            <label for="student-id">Student ID:</label><br>
                            <input id="student-id" type="text" placeholder="Student ID" required><br><br>

                            <label for="phone-number">Phone Number:</label><br>
                            <input id="phone-number" type="tel" placeholder="Phone Number" required><br><br>

                            <label for="programme">Programme:</label><br>
                            <input id="programme" type="text" placeholder="Programme"><br><br>

                            <label for="interest">Area of Interest:</label><br>
                            <select id="interest">
                                <option value="">-- Select an area --</option>
                                <option value="Artificial Intelligence">Artificial Intelligence</option>
                                <option value="Machine Learning">Machine Learning</option>
                                <option value="Prompt Engineering">Prompt Engineering</option>
                                <option value="Coding and Web Development">Coding and Web Development</option>
                                <option value="Innovation Challenges">Innovation Challenges</option>
                            </select>
                        </fieldset>

                        <br>

                        <fieldset>
                            <legend>Account Information</legend>

                            <label for="username">Username:</label><br>
                            <input id="username" type="text" placeholder="Choose a username" autocomplete="username" required><br><br>

                            <label for="user-email">Email:</label><br>
                            <input id="user-email" type="email" placeholder="Email" autocomplete="email" required><br><br>

                            <label for="user-pwd">Password:</label><br>
                            <input id="user-pwd" type="password" placeholder="Password" minlength="6" autocomplete="new-password" required><br><br>

                            <label for="confirm-pwd">Confirm Password:</label><br>
                            <input id="confirm-pwd" type="password" placeholder="Confirm Password" minlength="6" autocomplete="new-password" required>
                        </fieldset>

                        <br>
                        <button id="sign-up-btn" type="submit">Sign Up</button>
                    </div>

                    <div id="sign-in-panel" hidden>
                        <fieldset>
                            <legend>Member Sign In</legend>

                            <label for="login-identifier">Email or Username:</label><br>
                            <input id="login-identifier" type="text" placeholder="Email or Username" autocomplete="username"><br><br>

                            <label for="login-password">Password:</label><br>
                            <input id="login-password" type="password" placeholder="Password" autocomplete="current-password"><br><br>

                            <button id="sign-in-btn" type="button">Sign In</button>
                        </fieldset>
                    </div>

                    <p id="form-message" role="status" aria-live="polite"></p>
                </form>

                <br>

                <div id="auth-status" style="display: none;">
                    <p>Logged in as: <strong id="signed-in-email"></strong></p>
                    <button id="sign-out-btn" type="button">Sign Out</button>
                </div>
            </section>
        </section>
    </main>

    <footer> <hr> <p>&copy; 2026 LOGICKlub. Built for UCCD2323.</p> </footer>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/join.js"></script>
    <script src="js/bar.js"></script>
</body>

</html>
