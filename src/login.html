<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/bar.css">
    <link rel="stylesheet" href="css/login.css">
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/login.js"></script>
    <script src="js/theme.js"></script>
</head>

<body>
    <nav class="navbar" id="navbar"></nav>

    <main>
        <section>
            <h1>Member Login</h1>
            <p>Welcome back! Please enter your credentials to sign in.</p>

            <form id="login-form">
                <fieldset>
                    <legend>Credentials</legend>

                    <label for="login-email">Email:</label><br>
                    <input id="login-email" type="email" placeholder="Email" required><br><br>

                    <label for="login-pwd">Password:</label><br>
                    <input id="login-pwd" type="password" placeholder="Password" minlength="6" required>
                </fieldset>
                <br>

                <button type="submit">Sign In</button>
            </form>
            <br>
            <p>Don't have an account? <a href="join.html">Register here</a>.</p>
        </section>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 LOGICKlub. Built for UCCD2323.</p>
    </footer>
    <script src="js/bar.js"></script>
</body>

</html>
